[package]
name = "ttr_core"
version = "0.1.0"
edition = "2021"
authors = ["Christian Carminati", "Antigravity"]
description = "High-performance native Rust core and bitboard game engine for Ticket to Ride RL Lab"

[lib]
name = "ttr_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22.6", features = ["extension-module"] }
rand = "0.8.5"
rand_xoshiro = "0.6.0"
rayon = "1.10.0"
